<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Store Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carter+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .hero-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .comic-font { font-family: 'Carter One', system-ui; font-weight: 400; font-style: normal; }
        .comic-card { transition: all 0.3s ease; border: 1px solid #1e293b; }
        .comic-card:hover { transform: translateY(-5px); border-color: #ef4444; box-shadow: 0 10px 20px -10px rgba(239, 68, 68, 0.5); }
    </style>
</head>
<body class="p-4 md:p-8">

<!-- Header -->
<header class="max-w-6xl mx-auto flex justify-between items-center mb-10 border-b-2 border-pink-600 pb-4">
    <h1 class="text-4xl md:text-5xl comic-font text-pink-500 uppercase">Comic Shop</h1>
    <button onclick="openModal()" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-6 rounded-full shadow-lg transform active:scale-95 transition">
        + Adicionar HQ
    </button>
</header>

<!-- Grid de HQs -->
<main id="comic-grid" class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Os cards serão inseridos aqui pelo JS -->
</main>

<!-- Modal (Add/Edit) -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 p-8 rounded-lg w-full max-w-md border-2 border-pink-500 shadow-2xl">
        <h2 id="modal-title" class="text-3xl hero-font text-pink-500 mb-6">Nova HQ</h2>

        <input type="hidden" id="comic-id">

        <div class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Título da HQ</label>
                <input type="text" id="name" class="w-full bg-slate-700 border border-slate-600 rounded p-2 focus:outline-none focus:border-pink-500 text-white">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Editora</label>
                <input type="text" id="publisher" class="w-full bg-slate-700 border border-slate-600 rounded p-2 focus:outline-none focus:border-pink-500 text-white">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Preço (R$)</label>
                <input type="number" step="0.01" id="price" class="w-full bg-slate-700 border border-slate-600 rounded p-2 focus:outline-none focus:border-pink-500 text-white">
            </div>
        </div>

        <div class="flex justify-end space-x-3 mt-8">
            <button onclick="closeModal()" class="text-gray-400 hover:text-white px-4 py-2">Cancelar</button>
            <button onclick="saveComic()" class="bg-pink-600 hover:bg-pink-700 px-6 py-2 rounded font-bold transition">Salvar HQ</button>
        </div>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
